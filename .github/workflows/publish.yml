# Publishes to PyPI when a GitHub release is published.
# One-time setup on pypi.org: add a (pending) trusted publisher for project "snapcall",
# owner AIAnytime, repository snapcall, workflow publish.yml, environment pypi.
name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build dashboard
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: ui
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel + sdist
        run: |
          uv build
          unzip -l dist/*.whl | grep -q "snapcall/server/static/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
