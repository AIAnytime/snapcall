[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapcall"
version = "0.1.2"
description = "Build better decision models. Open-source toolkit to train, evaluate and deploy calibrated Jev-style System One decision models. CLI + dashboard."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AI Anytime" }]
requires-python = ">=3.10"
keywords = ["decision-model", "system-one", "jev", "snapcall", "fine-tuning", "calibration", "rlcd", "lora"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3",
  "transformers>=4.56",
  "peft>=0.13",
  "accelerate>=0.34",
  "datasets>=3.0",
  "huggingface_hub>=0.25",
  "safetensors",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart",
  "typer>=0.12",
  "rich>=13",
  "faker>=25",
  "httpx>=0.27",
  "pyyaml",
  "psutil",
  "tensorboard>=2.16",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
qlora = ["bitsandbytes>=0.43"]
all = ["anthropic>=1.0", "bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = ["pytest", "ruff"]

[project.scripts]
snapcall = "snapcall.cli:main"

[project.urls]
Homepage = "https://github.com/AIAnytime/snapcall"
Repository = "https://github.com/AIAnytime/snapcall"
Issues = "https://github.com/AIAnytime/snapcall/issues"

[tool.hatch.build.targets.wheel]
packages = ["snapcall"]
artifacts = ["snapcall/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["snapcall", "tests", "README.md", "pyproject.toml", "LICENSE"]
artifacts = ["snapcall/server/static/**"]

[tool.ruff]
line-length = 120
